name: Deploy landing page via FTP

on:
  push:
    branches:
      - main
    paths:
      - "landing_page/**"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Upload landing_page/ via FTPS
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -e
          cd landing_page
          for f in *; do
            [ -f "$f" ] || continue
            echo "Uploading $f"
            # TLS 1.2 forced: this ProFTPD (Tophost) drops the data channel with a
            # "426 Transfer aborted" on TLS 1.3 for files above a few KB.
            # -k: the FTP hostname's certificate is a shared wildcard (*.th.seeweb.it)
            # that doesn't match ftp.<domain>, which is expected on this shared host.
            curl -sS --ssl-reqd -k --tlsv1.2 --tls-max 1.2 \
              -T "$f" "ftp://${FTP_HOST}/$f" \
              --user "${FTP_USERNAME}:${FTP_PASSWORD}"
          done
