# Local Firebase emulators (Auth + Firestore) used by `npm run dev:local`
# and by the Playwright suite (`npm run test:e2e`). Never touches the real
# Firebase project — see Dockerfile.emulator.
services:
  emulators:
    build:
      context: .
      dockerfile: Dockerfile.emulator
    ports:
      - "8080:8080" # Firestore
      - "9099:9099" # Auth
      - "4000:4000" # Emulator UI
    healthcheck:
      test: ["CMD", "sh", "-c", "curl -f http://localhost:8080 && curl -f http://localhost:9099"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 5s
